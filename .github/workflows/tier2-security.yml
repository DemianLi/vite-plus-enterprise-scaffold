# Tier 2 — 安全閘門（D10）
#
# ── 這個 workflow 的三條規則，改動前請先讀完 ────────────────────────────
#
# 1. **不快取。** 一格都不要加。
# 2. **不做 affected 過濾。** 全量掃。
# 3. **必須有時間觸發**，不能只有 commit 觸發。
#
# 理由是同一個：安全掃描的結果**會隨時間失效，即使程式碼一個字都沒改**。
# 今天 lodash 被公布一個 critical CVE，你的程式碼沒動、快取指紋沒變、
# affected 過濾判定「無影響」—— 於是掃描命中快取回綠燈，
# 而你的專案此刻正是脆弱的。
#
# 這不是理論風險，是快取語意與漏洞語意的根本錯配。
#
# 另外：本層**刻意不經過 `vp`**，直接呼叫底層執行檔。
# D2 保單要求安全閘門獨立於可替換的驅動層 —— vite-plus 是 0.2.x beta，
# 哪天換掉它，這道閘門必須原封不動繼續運作。

name: Tier 2 — 安全閘門

on:
  pull_request:
  schedule:
    # 每日 21:00 UTC ＝ 台北時間隔日 05:00。
    # 這是本 workflow 最重要的一行：沒有它，三個月沒人動的專案就三個月沒掃過。
    - cron: "0 21 * * *"
  workflow_dispatch:

# 與 Tier 1 相反：**不取消進行中的執行**。
# 排程掃描被新的 push 取消，等於當天沒掃。
concurrency:
  group: tier2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  gate:
    # ⚠️ **固定 `name`，因為下面有 matrix。** 不指定的話 check 會叫
    # `gate (main)`、`gate (…)`，而 required status check 認的是名字 ——
    # 名字一變，那道保護就靜靜地失效（沒有任何東西會紅）。
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # 一條線紅了不該讓另一條線的掃描被取消 —— 那會讓當天少掃一條。
      fail-fast: false
      matrix:
        # ── 為什麼排程要帶分支清單（C113）────────────────────────────
        #
        # ⚠️ **GitHub 的 scheduled workflow 只跑預設分支上的 workflow 檔**，
        # 而預設分支是 `main`。實測 `gh run list --event schedule`：連續八天
        # 全部是 `main`，**當時的交付線 `release/v1` 從來沒有被每日掃描過**。
        #
        # 檔頭第一條說「沒有它，三個月沒人動的專案就三個月沒掃過」；
        # 那句話對那條線一直是成立的，只是沒有人發現。
        #
        # ⚠️ **2026-08-26 起清單只剩 `main`**：`release/v1` 已併回並刪除（C133／#86）。
        # 留著它的後果不是「多掃一條」，是**每天一個紅燈** —— checkout 一個不存在的
        # ref 會失敗，而 `fail-fast: false` 保證另一條照跑、紅燈照留。
        # 實測：08-23 起連續三天的排程都紅在 `gate (release/v1)` 那一格，
        # 而 `gate (main)` 那格是綠的 —— ⚠️ **一個沒有人在看的每日紅燈，
        # 就是下一次真的紅燈不會被注意到的原因。**
        #
        # 這份清單就是這個機制的全部 —— 開下一條長命分支時，要記得加回來。
        #
        # ⚠️ 空字串 = checkout 的預設行為（當前 ref）。PR 與手動觸發要掃的是
        # **當下這份程式碼**，不是清單上那幾條 —— 所以清單只在排程時展開。
        ref: ${{ github.event_name == 'schedule' && fromJSON('["main"]') || fromJSON('[""]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks 需要完整歷史才能掃出被後續 commit 蓋掉的機密。
          fetch-depth: 0
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # 見 tier1-quality.yml 對這一步的說明（DECISIONS.md C8）。
      - name: Bootstrap Vite+
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes --package vite-plus@0.2.9 \
            vp -C "$GITHUB_WORKSPACE" install --frozen-lockfile

      # ⚠️ 這裡沒有 cache restore，而且是刻意的。見檔頭第 1 條。

      # ── 切片契約與邊界（D4 第 1、3 層 / D9）──────────────────────────
      - name: 一致性檢查
        run: node tools/conformance/src/cli.ts

      # ── platform 破壞性變更（D12）────────────────────────────────
      # 在單一 monorepo 裡，platform/ 就是腳手架本身：改它等於同時改動所有切片、
      # 所有團隊。因此 breaking change 必須附 codemod，由提出者在同一 PR 跑完全 repo。
      # 這一步讓那條規則有牙齒 —— 否則它只是一句寫在文件裡的話。
      - name: platform API 表面檢查
        run: node tools/api-surface/src/cli.ts

      # ── D8 中間層契約（R6）────────────────────────────────────────
      # 對參考實作跑，證明這份契約是可實現的 —— 一份沒有任何實作通過的規格，
      # 通常是一份寫錯的規格。驗收組織既有的 gateway 時改的是 env，不是這一行：
      #   BFF_ORIGIN=https://gateway.internal ./node_modules/.bin/vitest run --root tools/bff-check
      #
      # 放在 Tier 2 而非只在 Tier 1：這是認證與 CSRF 的行為契約，
      # 不該因為「這次改動與它無關」而被 affected 過濾跳過。
      - name: BFF 契約驗收
        run: ./node_modules/.bin/vitest run --root tools/bff-check

      # ── D2 退出保單（R1／R9）──────────────────────────────────────
      # 靜態檢查：退出面有沒有從兩個設定檔擴大出去。
      # --require-fresh：完整演練的證據超過 120 天就 fail。
      # 這個旗標只在時間觸發的 workflow 裡加 —— 在 PR 上因為「日曆翻頁了」
      # 而擋人，那種閘門會先被繞過、再被忽略。
      - name: D2 退出面檢查（PR：只驗退出面，不管證據新鮮度）
        if: github.event_name == 'pull_request'
        run: node tools/exit-drill/src/cli.ts

      - name: D2 退出面檢查（排程：連證據新鮮度一起驗）
        if: github.event_name != 'pull_request'
        run: node tools/exit-drill/src/cli.ts --require-fresh

      # ── 供應鏈盤點（R2／R3／R4／R5／R8）──────────────────────────────
      # 刻意**不**用 if: 分流（與上面的退出演練不同）。退出演練的新鮮度是日曆問題，
      # 這裡沒有任何一項跟時間有關 —— 全部是「這次變更把什麼東西帶進了建置環境」，
      # 那正是 PR 上最該問的問題。而且它不連網、只讀 lockfile，跑得很快。
      #
      # 這一步擋下來的典型情況：升 vite-plus 時多冒出一個原生工具鏈家族。
      # 沒有它，那個家族會在沒有人分類、沒有申請例外的情況下進到建置環境，
      # 然後在資安覆核時才被發現 —— 而那時它已經是既成事實。
      - name: 供應鏈盤點與來源綁定
        run: node tools/supply-chain/src/cli.ts

      # ── 法遵對照表（D16）──────────────────────────────────────────
      # 驗的是「這張表沒有說謊」，兩個方向都驗：宣告有反向測試的檔案必須
      # 存在（表在高估自己 = 危險），宣告沒有的慣例路徑必須不存在
      #（補了測試沒更新映射 = 表上掛著假的洞，而假的洞會讓真的洞失去意義）。
      #
      # 放在 Tier 2 而不是 Tier 1：它產出的是拿去回答稽核的東西，
      # 不該因為「這次改動與它無關」而被 affected 過濾跳過。
      - name: 法遵對照表
        run: node tools/compliance/src/cli.ts

      # ── §16 證據清單 ──────────────────────────────────────────────
      # 產出的是**交接用的那張表**，不是保存期政策 —— 後者是組織文件
      #（誰歸檔、存哪、銷毀排程、負責人），寫進 repo 只會變成沒有人執行的樣板。
      #
      # 這一步驗的是清單沒有腐爛：宣告的檔案都在，且每一份都有閘門在維護。
      # 加新工具時最容易漏的就是「把它的證據檔列進來」——
      # 漏掉的那份不會進保存排程，五年後要調閱才發現不在。
      - name: §16 證據清單
        run: node tools/compliance/src/cli.ts --evidence

      # ── 個資的兩條現行義務（§11 II ⑥／⑨）──────────────────────────
      # ⑥ 測試環境不得使用真實個人資料。抓的是**有校驗碼的識別碼**
      #   （身分證字號、Luhn 卡號、手機）與指向真實網域的信箱 ——
      #   亂打的字串幾乎不可能通過校驗，所以誤報率天生就低。
      #   **姓名抓不到**，所以那一條的覆蓋是部分不是完整。
      #
      # ⚠️ 這裡原本還有第二步「個資：畫面上必須隱碼」，跑 `--masking`。
      #   C52 拿掉了那個模式，但**這一步被留了下來** —— 而 CLI 當時
      #   忽略不認得的旗標，於是它安靜地把 ⑥ 又掃了一次、綠燈、
      #   頂著一個宣稱在守 ⑨ 的步驟名稱。PR 就是這樣全綠合進來的。
      #
      #   這是這個 repo 的招牌失敗形狀第九次出現：**綠燈代表沒有東西看過。**
      #   而且這次更糟 —— 步驟名稱主動說了謊。
      #
      #   修法是兩邊都補：這裡刪掉步驟，CLI 那邊改成**不認得的旗標就紅**。
      #   只刪步驟的話，下一個被拿掉的旗標會用一模一樣的方式溜過去。
      - name: 個資：測試環境不得用真個資
        run: node tools/pii-check/src/cli.ts

      # ── 文件數字（A1）─────────────────────────────────────────────
      # 「N 個套件、N 個原生二進位、N 個家族」這幾句是拿去跟採購與資安
      # 講的話。它們每次相依變動就會變，而這個 repo 在「人抄下來的數字
      # 沒有人再推導一次」上栽過很多次。
      #
      # ⚠️ 這段註解**刻意不寫實際數字**。第一版寫了「519 個套件」，
      #   然後在相依變到 563 的時候，一段在講「不要抄數字」的註解
      #   自己就是一個抄來的過期數字。同理不寫「已經栽了 N 次」。
      #
      # ⚠️ 守哪幾份由 tools/doc-facts/src/cli.ts 的 GUARDED 決定，這裡不重抄
      #   （閘門自己會把清單印出來）。DECISIONS.md 刻意不守 —— 它是決策日誌，
      #   「C24 當時是 467 個套件」陳述的是歷史，守它等於要求回頭改寫歷史，
      #   而一份被持續改寫的決策日誌就不再是決策日誌了。
      - name: 文件數字與事實來源一致
        run: node tools/doc-facts/src/cli.ts

      # ── SCOPE.md vs. 版控裡真正存在的目錄（C73）────────────────────
      # 緊接在上一步後面，因為兩者中間就是那條縫：**doc-facts 守數字，
      # 這一步守清單。** 寫 SCOPE.md 的那一版順手抓到 README 的目錄樹列著
      # `tools/sast/`，而那個目錄從來不在 `release/v1` 的樹上 —— 整行是假的，
      # 而當時全套閘門照樣全綠。
      #
      # ⚠️ 它擺在 Tier 2 **不是因為檔頭那三條規則**。SCOPE.md 與版控兩邊都在
      # git 裡，程式碼不動它就不會失效 —— 用檔頭的判準去套，這一步該在 Tier 1。
      # 放這裡的理由與 doc-facts 同一條：它跨整個 repo，不該因為
      # 「這次改動與它無關」而被 affected 過濾跳過。
      #
      # ⚠️⚠️ **這一步在 `main` 上刻意不存在**（#159 §四）。`SCOPE.md` 講的是
      # 「什麼准許出現在 `release/v1` 的樹上」，而 `main` 是超集 —— 對這棵樹跑它
      # 會滿江紅，而那個紅是「`main` 的邊界還沒定義」的表現，不是工具壞了。
      # 邊界怎麼定是 #90（清單與判準）與 #93（閘門設計）的產出。
      # 工具與 `SCOPE.md` 都保留著，登記在 `gates.ts` 的 `UNGATED` 裡。

      # ── specs/ 寫的承諾，現在還是真的嗎（C118）─────────────────────
      # 它與上面每一步都不同：不是再驗一次某條規則，而是**照著規格把一份
      # 切片副本弄壞、跑規格指名的那道閘門、比對結果**。承諾與閘門對不
      # 對得上，在此之前只有人讀得出來（HANDOFF 自己招認過這件事）。
      #
      # ⚠️ 它會 spawn 別的閘門，所以擺在那些閘門後面：那幾道自己先紅的話，
      # 這裡的紅燈只是回音。
      - name: 框架承諾檢查
        run: node tools/promise-check/src/cli.ts

      # ── 安全 lint（D5）─────────────────────────────────────────────
      # 只裝安全規則，與 oxlint 零重疊。存在的首要理由是 oxlint 沒有
      # vue/no-v-html —— Vue 專案最主要的 XSS 入口。
      - name: ESLint 安全規則
        run: ./node_modules/.bin/eslint . --max-warnings=0

      # ── SAST（源碼檢測）────────────────────────────────────────────
      #
      # ⚠️ **這不是要交給機關的那份 SAST 報告。** 源碼掃描報告是標案的交付物，
      # 由第三方或機關指定的商用工具產出。這裡是**開發當下**的前置過濾器：
      # 廠商掃出來的東西你們要在驗收期限內改完，改不完就是延遲驗收 ——
      # 這一步把「驗收前才知道」變成「開發當下就知道」。
      #
      # ── 為什麼是自寫規則，不是 semgrep 的公開規則集（C56）───────────
      #
      # C54 當時的建議是改用 p/security-audit 這類公開規則集，理由是
      # 「自寫規則跟商用工具撞在一起的機率低」。**實測把那個建議推翻了**：
      # 拿一份故意寫壞的 fixture（route.query → innerHTML、new Function、
      # 字串型 setTimeout）去測，p/xss 12 條、p/security-audit 22 條、
      # p/owasp-top-ten 76 條、p/default 210 條 —— **四組全部命中 0**。
      # 同一份 fixture 下面這兩條自寫規則命中 2。
      #
      # 原因不神秘：公開規則集的重心在伺服器端樣板與框架，
      # Vue SPA 的瀏覽器端 DOM 汙點流是它們覆蓋得最薄的一塊。
      #
      # 所以規則留在 repo 裡。附帶好處是它們是**釘住的** —— 註冊表的
      # `p/xxx` 是會移動的指標，規則變了不需要任何 commit，
      # 而那會讓一個沒改過的 PR 因為上游改規則而變紅。
      #
      # ⚠️ semgrep 是 Python 工具，**不在 pnpm-lock.yaml 裡** ——
      # tools/supply-chain 的盤點看不到它。它以容器映像進來，
      # 而那是一個獨立於本 repo 供應鏈論證之外的信任決定（見 HANDOFF 第 21 項）。
      #
      # 先驗規則會不會命中，再拿規則去掃 repo。順序是刻意的：
      # 一組壞掉的規則掃出零個發現，看起來與「沒有問題」一模一樣。
      - name: "SAST 規則的反向測試"
        run: |
          # ⚠️ **這一行不能拿掉。** GitHub Actions 的預設 shell 是 `bash -e {0}`
          #   （log 裡逐字印著）—— 有 `-e`，**沒有 `pipefail`**。少了它，下面那個
          #   管線取的是 `tee` 的退出碼，semgrep 自己的那個被丟掉，`-e` 永遠不會
          #   為它開火（#144 實測：規則退化時執行流程一路走到了下面的文字防呆，
          #   證明管線回傳的是 0）。
          #
          #   ⚠️ 下面兩道文字防呆**不是**這一行的替代品，也不是重複：
          #   它們防的是 semgrep **回傳 0** 的那一類（找不到 fixture），
          #   而這一行防的是它回傳非 0 卻被管線吃掉的那一類。缺一不可。
          set -o pipefail

          # ⚠️ 掛載的是 **.semgrep 目錄本身**，而且 --config 指向 `.`。
          #   兩者都是必要的：semgrep 配對 fixture 時算的是規則檔與目標檔的
          #   相對路徑，工作目錄必須就是規則目錄。從 repo 根目錄下
          #   `--test --config .semgrep` 配對不上 —— **而它不會報錯**，
          #   它印「No unit tests found」然後回傳 0。那正是下面兩道防呆的理由。
          docker run --rm -v "$GITHUB_WORKSPACE/.semgrep:/src" -w /src \
            semgrep/semgrep@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be semgrep --test --config . \
            | tee semgrep-test.log

          # 兩道防呆，缺一不可：
          # ① 「沒找到測試」要當成失敗 —— semgrep 對它回傳 0
          if grep -q "No unit tests found" semgrep-test.log; then
            echo "✗ semgrep 沒有找到任何 fixture —— 規則一條都沒被驗證"
            echo "  零個測試通過，不是通過。"
            exit 1
          fi
          # ② 輸出裡必須有真的「N/N tests passed」數字。
          #   少了這一條，任何讓 semgrep 靜默的改動都會再度變成綠燈。
          if ! grep -qE "[0-9]+/[0-9]+: .*tests passed" semgrep-test.log; then
            echo "✗ 輸出裡找不到通過的測試數 —— 這一步不知道自己驗了什麼"
            exit 1
          fi

      - name: SAST 掃描
        # ⚠️ 一定要排除 .semgrep/ —— rules.ts 是**故意寫壞的** fixture，
        #   不排除的話這一步永遠紅，而紅的原因是我們自己種的。
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            semgrep/semgrep@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be semgrep scan --config .semgrep/rules.yml \
              --error --sarif --output semgrep.sarif \
              --exclude .semgrep

      - name: 上傳 SAST 結果到 Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # ── 機密掃描 ──────────────────────────────────────────────────
      - name: Secret 掃描
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── SBOM（D1／D10）────────────────────────────────────────────
      # 從**根目錄**的 pnpm-lock.yaml 一次產出全 repo 的 SBOM。
      # 不要每個 package 各產一份 —— D3 是共用 lockfile，分開產只會得到
      # N 份互相矛盾的 SBOM。
      #
      # 選 Trivy 是因為它原生讀 pnpm-lock.yaml 並能輸出 CycloneDX。
      # ⚠️ 若貴組織的 SCA 是 Blackduck／Snyk，這兩步要換成對應工具 ——
      # 交付給稽核的必須是稽核認可的那個工具的輸出。
      #
      # ⚠️⚠️ 下面兩件事**都是必要的，不是調校**。少了任何一件，掃描器都會
      # 在完全綠燈的情況下產出一份沒有內容的 SBOM。兩件都是實測出來的：
      #
      #   ① TRIVY_INCLUDE_DEV_DEPS —— 少了它，Trivy 印一行 INFO
      #      「Suppressing dependencies for development and testing」然後給出
      #      **0 個 component**。這個 repo 是腳手架，工具鏈（含 R2 那 121 個
      #      原生二進位）全都是 dev 相依，抑制掉等於什麼都沒掃。見 C33。
      #
      #   ② 拆開 lockfile —— pnpm-lock.yaml 是**兩份 YAML 文件**，而 Trivy 0.70.0
      #      只解第一份（＝ pnpm 自己的鎖，19 個套件）。實測：原檔 20 個 component、
      #      只留第二份文件 450 個。見 C34。拆成兩個目錄再一起掃，兩份都看得到。
      #
      # 換掉 Trivy 時這兩件事都要重新驗，而且要保留下面那道 SBOM 完整性檢查 ——
      # 它才是真正擋下這類問題的東西（①只把 0 變成 20，問題還在，但更難發現）。
      - name: 拆出掃描器讀得懂的 lockfile
        run: node tools/supply-chain/src/cli.ts --split-lockfile .scan

      - name: 產出 SBOM（CycloneDX）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .scan
          format: cyclonedx
          output: sbom.cdx.json
          scanners: license,vuln

      # 上傳**排在檢查之前**，而且 if: always()。SBOM 有問題的時候正是最需要
      # 拿到那份檔案的時候 —— 把上傳放在檢查後面，一失敗就沒有證據可看，
      # 只能靠猜。（第一次就是這樣：檢查紅了，artifact 沒上傳，無從診斷。）
      - name: 上傳 SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      # 產出不等於有內容。這一步比對 SBOM 的 component 數與 lockfile 的套件數 ——
      # 兩個獨立來源數同一份檔案，差太多就是有一邊瞎了。
      # 少了這道檢查，「掃描器看不到任何套件」會以綠燈的形式通過，
      # 而稽核收到的是一份看起來很正常的空 SBOM。
      - name: SBOM 完整性檢查
        run: node tools/supply-chain/src/cli.ts --verify-sbom sbom.cdx.json

      # ── 相依性漏洞（D13 修補 SLA；實際射程見 C160）─────────────────
      #
      # ⚠️ 這道閘門是**全嚴重度零容忍**：任何一條有修補版本的漏洞，不分
      # critical／high／medium／low／unknown，都讓整個 job 紅。D13 那張表寫的是
      # 分級（critical 3 天／high 14 天／medium 下個 sprint），而**樹上沒有任何
      # 東西實作那個分級** —— 這一步沒有，Renovate 的 `vulnerabilityAlerts`
      # 也沒有（#244／C160）。
      - name: SCA 漏洞掃描
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # 同上：少了這行，這道閘門掃 0 個套件、永遠回綠燈，
          # 而 D13 的修補 SLA 就是靠它把關的。
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .scan
          format: sarif
          output: trivy.sarif
          # ⚠️ **這裡刻意沒有 `severity:`。** 原本寫著 `HIGH,CRITICAL`，而它一次
          # 都沒有生效過：`format: sarif` 且沒給 `limit-severities-for-sarif` 時，
          # action 印一行「Building SARIF report with all severities」並用全嚴重度
          # 重建報告 —— `exit-code` 是對那一份算的。#243 擋下 `main` 的正是兩條
          # MEDIUM，而同一份樹用 `--severity HIGH,CRITICAL` 掃出 0 條。
          # ⚠️⚠️ 它是**休眠**，不是死透：`TRIVY_SEVERITY` 照樣被設進去，只是被
          # sarif 那條路徑蓋掉。把上面 `format:` 換成 `table`，那一行就會醒過來、
          # 把閘門悄悄縮到只剩 high／critical。刪掉它才拆得掉這個陷阱。
          # 要分級就要一則裁決（#244／C160），不是補一個 `with:` 鍵。
          exit-code: "1"
          ignore-unfixed: true

      - name: 上傳掃描結果到 Code Scanning
        # 即使前一步因為發現漏洞而失敗，仍要上傳結果 —— 否則看不到是什麼。
        #
        # ⚠️ 但 always() 也會在前面的步驟**被跳過**時觸發，而那時 trivy.sarif
        # 根本不存在，於是這一步以 "Path does not exist" 失敗，蓋掉真正的失敗原因。
        # 實際發生過（首次在 Actions 上執行時）：BFF 契約那步 exit 127，
        # 掃描步驟被跳過，然後這裡也紅 —— 兩條紅訊息，只有一個真的問題。
        # 加上 hashFiles 判斷：檔案有產出才上傳。
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy.sarif
          # ⚠️ 少了這一行，configuration 的身分就從 workflow ＋ job 名 ＋ matrix 的值
          # 推導 —— 而 `gate` 的 matrix `ref`（C113）排程展開成 "main"、PR 是空字串，
          # 於是 PR 那一趟跟 `main` 上的結果永遠對不上：Code Scanning 算不出「這支 PR
          # 新引入了哪些 SCA 告警」，Trivy 那格 check 就永遠停在 neutral。
          # ⚠️ 而一個永遠 neutral 的 check，跟一個從來沒跑過的 check 長得一樣（#240）。
          category: trivy

      # ── 供應鏈：原生二進位例外的憑證（R2／R4）─────────────────────
      # 這裡原本有一步：`npm view vite-plus dist.attestations > provenance.json`。
      # 已移除，因為它在三件事上是錯的：
      #
      #   1. 只涵蓋 vite-plus 一個套件。實際的原生二進位有 **121 個、11 個家族**
      #      （見 C27），而且大半不是 vite-plus 帶來的（TypeScript 7、lightningcss）
      #   2. 每次 CI 重新抓一份，等於**沒有基線** —— 抓到什麼就是什麼，
      #      對不上也不會有人知道。R4 要的是「擷取一次、之後離線比對」
      #   3. 檔名與 tools/supply-chain/provenance.json 撞名，而兩者內容完全不同
      #
      # 取而代之的是上面那一步「供應鏈盤點與來源綁定」：來源證明已進版控
      #（tools/supply-chain/provenance.json，121 筆），CI 只負責驗它與 lockfile 一致。
      # 交給資安的申請書用 `vpr sca-dossier` 產生。
