# Tier 1 — 品質（D10）
#
# 目標：快到開發者願意等。允許快取、允許 affected 過濾。
# 這一層**不放任何安全檢查** —— 安全走 tier2-security.yml，理由見該檔開頭。

name: Tier 1 — 品質

on:
  pull_request:
  push:
    branches: [main]

# 品質檢查可以被新的 push 取消：舊的結果已無意義。
# （Tier 2 刻意相反，見該檔。）
concurrency:
  group: tier1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # vite-plus 要求 ^20.19.0 || ^22.18.0 || >=24.11.0
          node-version: "24"

      # ── 測試邊界地圖 ────────────────────────────────────────────────
      # 放在最前面，理由是**它必須在任何一步失敗之前就已經印出來** ——
      # 半張表跟一張短表長得一模一樣。
      #
      # ⚠️ 這張表是**地圖不是結果**：哪一步過了看下面的步驟清單，
      #    步驟名的前綴標著它屬於哪一層。
      # ⚠️ 判準的來源是 TESTING.md 的〈二、五層 × 兩類〉與〈五、五層量不到的
      #    機制〉。**這裡刻意不重抄閘門清單** —— 那份清單的唯一來源是
      #    tools/gate-roster/src/gates.ts，抄第二份正是那支工具存在的理由。
      - name: 測試邊界地圖（Tier 1）
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MAPEOF'
          ## 測試邊界地圖 —— Tier 1（品質快軌）

          判準來源：`TESTING.md` §二〈五層 × 兩類〉、§五〈五層量不到的機制〉。
          **這是地圖不是結果** —— 每一步過了沒有，看下面的步驟清單。

          | 層 | 這一層問什麼 | Tier 1 有沒有東西在守 |
          | --- | --- | --- |
          | 層 1 約束 | 程式碼有沒有纏成一團 | ✅ 三步：格式／lint／型別、`.vue` 型別、無障礙靜態 |
          | 層 2 單元 | 實作細節對不對 | ✅ 一步：全 workspace 測試 |
          | 層 3 驗收 | **什麼叫做對** | ⚠️ 檢查在跑，而**版控裡 0 份切片規格 → 它恆綠**（TESTING.md §二） |
          | 層 4 QA | 怎麼驗它真的能用 | ❌ **無（刻意）** —— 人做的事，下發不了 |
          | 層 5 手動 | 規格本身有沒有寫錯 | ❌ **無（刻意）** —— 人做的事，下發不了 |
          | 元層 突變 | 那些沒人審的測試是不是空頭支票 | ❌ **不在 CI（刻意）** —— `thresholds.break` 是 `null`，產出是清單不是分數 |
          | **五層答不出** | —— | 步驟名前綴標了。TESTING.md §五：借來的座標整個只描述第一類 |

          ⚠️ **三列是空的，而三列都是刻意的。** 綠燈的意思是「有東西在守的那幾層守住了」，
          不是「六層都守住了」。

          ⚠️ 層 3 那一列尤其要小心：**0 份規格與全部通過，在報表上長得一模一樣。**
          MAPEOF

      # ── Bootstrap ────────────────────────────────────────────────────
      # 全新 checkout 沒有 node_modules，因此也沒有 vp。
      # 必須從**專案目錄之外**執行 npx，再用 -C 指回專案 ——
      # 在專案目錄內執行會被本專案的 devEngines.packageManager: pnpm
      # 以 EBADDEVENGINES 直接拒絕（此路徑已於本機實測，見 DECISIONS.md C8）。
      #
      # 內部 registry 環境下，這一步是第一個會斷的地方（R3／R5）：
      # 需設定 npm_config_registry 與 NODE_EXTRA_CA_CERTS。
      - name: Bootstrap Vite+
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes --package vite-plus@0.2.9 \
            vp -C "$GITHUB_WORKSPACE" install --frozen-lockfile

      # ── 任務快取 ─────────────────────────────────────────────────────
      # Tier 1 的主要提速手段。`vp run` 沒有 changed-since 過濾器，
      # 靠快取命中跳過未變動的任務（本機實測 4/5 命中）。
      - name: Restore Vite task cache
        id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # ── 閘門名冊（C132，併線前 `release/v1` 上是 C71）──────────────────────────────────
      #
      # 放第一個，因為它最便宜（只讀四個檔案），而「設定對不上」這件事
      # 你會希望在花三十秒跑型別檢查**之前**就知道。
      #
      # 它比對的是：`package.json` 的 `gate` 與各別名、這兩個 workflow、
      # README〈兩層檢查〉那張表 —— 同一份閘門清單在那幾處各寫一份，而在這道
      # 閘門出現之前，沒有任何東西在斷言它們一致。
      #
      # 接上它的當下，main 上抓到三件事：`doc-facts` 與 `pii-check` 在
      # Tier 2 跑而不在 `scripts.gate` 裡（本機 `vpr ready` 全綠、CI 紅，
      # 與 #51 修過的那個毛病一模一樣）、`vue-typecheck` 沒有單獨跑的別名、
      # 以及 README 那張表的兩格加起來漏了九道。見 C132。
      #
      # ⚠️ 在 Tier 1 而不是 Tier 2，理由與下面設計系統接縫那一步同一條：
      # Tier 2 的三條規則只為了「安全掃描的結果會隨時間失效」，
      # 而「四份名冊有沒有對齊」不會隨時間失效。
      #
      # ⚠️ 它**看不見 `exit-drill.yml`**（每季排程的完整演練），也看不見
      # semgrep／gitleaks／Trivy 那些 docker 與 `uses:` 步驟。理由寫在
      # `tools/gate-roster/src/gates.ts` 的檔頭 —— 一道只守半個檔案的閘門，
      # 必須自己講明白守的是哪半個。
      - name: 五層答不出 · 閘門名冊一致
        run: node tools/gate-roster/src/cli.ts

      # ── 清單與樹對不對得上（C73／C136）───────────────────────────────
      #
      # 排在名冊之後、型別檢查之前，理由同上：它只讀兩份清單，很便宜，
      # 而「樹上多了一個沒有人寫過一句它是什麼的東西」你會希望早點知道。
      #
      # ⚠️ 在 Tier 1 而不是 Tier 2：Tier 2 的三條規則只為了「安全掃描的結果
      # 會隨時間失效」，而「清單與樹對不對得上」不會 —— 它只在樹或 SCOPE.md
      # 改動時才變。與名冊那一步、設計系統接縫那一步同一條理由。
      #
      # ⚠️ 它的射程是 `platform/` 與根層，**不含 `tools/`** —— 那一層由
      # 上面那道名冊登記（C136 §四）。
      #
      # ⚠️ 這一步從 C133 到 C136 之間**不存在**：`SCOPE.md` 曾是已刪分支
      # `release/v1` 的快照，對這棵樹跑會滿江紅，所以它待在名冊的 UNGATED 裡。
      # 那個「暫時」由 #180 兌現，邊界定義在 C136。
      - name: 五層答不出 · SCOPE.md 與版控內容一致
        run: node tools/scope-check/src/cli.ts

      # ── 檢查 ─────────────────────────────────────────────────────────
      - name: 層 1 約束 · 格式、lint、型別（oxfmt + oxlint + tsgolint）
        run: ./node_modules/.bin/vp check

      # ── 上一步看不到的那一半（HANDOFF #26 / C68）──────────────────────
      #
      # `vp check` 的型別段是 tsgolint，**它不看 `.vue`**。實測：同一行
      # `const broken: number = "顯然是字串"` 放進 SFC 是 0 errors、
      # 放進 `.ts` 是 1 error。所以設計系統的元件原始碼在 2026-08-17 之前
      # 一行型別檢查都沒跑過。
      #
      # ⚠️ 這一步用的是**另一個 TypeScript**（`catalog:vue-typecheck` 的 JS 版
      # 5.x）。catalog 主線的 `typescript: ^7.0.2` 是原生 Go 版，已經沒有
      # vue-tsc 需要的 compiler API。
      #
      # ⚠️ 那第二份 TypeScript 不只是成本：`.ts` 檔消費 `.vue` 時，上一步看的是
      # `declare module "*.vue"` 的萬用宣告（任何 prop 都合法），這一步解析真的
      # SFC。所以**這一步紅、上一步綠，多半是真陽性**，不是兩支工具在吵架。
      # 見 DECISIONS 的 C68〈九〉。
      - name: 層 1 約束 · .vue 型別檢查
        run: node tools/vue-typecheck/src/cli.ts

      - name: 層 2 單元 · 測試
        run: ./node_modules/.bin/vp run -r test -- --reporter=default --reporter=json --outputFile=.vitest-results.json

      - name: 建置
        run: ./node_modules/.bin/vp run -r build

      # ── 驗收規格的完成率（TESTING.md 層 3 / C115）────────────────────
      #
      # ⚠️ **必須在 Tier 1、必須在測試之後** —— 它讀的是上一步留下的
      # `.vitest-results.json`，而那些檔案跨 workflow 拿不到。
      #
      # ⚠️ 它與上一步**不是重複的閘門**：測試看不見「規格一條都沒跑」
      # （接線檔的副檔名取錯時，測試本身是全綠的 —— C114 §二），
      # 而那正是這一步唯一守得住的東西。
      - name: 層 3 驗收 · 驗收規格完成率（⚠️ 0 份切片規格時恆綠）
        run: node tools/spec-report/src/cli.ts --check

      # ── 設計系統接縫（HANDOFF 第 24 項 / C62）─────────────────────────
      #
      # 為什麼在 Tier 1 而不是 Tier 2：與無障礙同一個理由（見下面那一段）。
      # Tier 2 的三條規則只為了一件事 —— 安全掃描的結果會隨時間失效。
      # **「各案換得掉配色」不會。** 沒有新公布的 CVE 會讓一個代幣變成換不掉。
      #
      # 這一步會真的跑兩次 Tailwind 建置（約 0.3 秒），因為它要驗的性質
      # 只有在產物裡看得到：Tailwind 掃不到來源時是**建置成功、CSS 還變大、
      # 但一個 utility 都沒有**。靜態讀 CSS 檔驗不到那件事。
      #
      # ⚠️ 綠燈的意思是「配色與形狀兩條軸實測可換」，**不是**「設計系統可換」。
      # 第三條軸（互動方式）不在這裡，而且不該在這裡 —— 互動是結構不是值，
      # 代幣換不了它。守它的是上面的 api-surface（slot／emit 必須宣告，C67）
      # 與 `.vue` 型別檢查（slot payload 的型別，C68）。三列的強度不一樣，
      # 差在哪寫在 platform/ui/README.md 那張表。
      - name: 五層答不出 · 設計系統接縫
        run: node tools/theme-verify/src/cli.ts
      # ── 無障礙靜態檢查（HANDOFF 第 22 項）─────────────────────────────
      #
      # 為什麼在 Tier 1 而不是 Tier 2：Tier 2 的三條規則（不快取、不過濾、
      # 要有時間觸發）只有一個理由 —— 安全掃描的結果會隨時間失效。
      # **無障礙不會。** 沒有新公布的 CVE 會讓一個有 alt 的 img 變成沒有 alt，
      # 所以放進 Tier 2 只會讓那三條規則多一個不適用的例外。
      #
      # ⚠️ **這一步對本 repo 的正常結果是零個發現，而模板是有缺陷的。**
      # 它比對的是原生元素與屬性，而本 repo 的互動幾乎都包在元件裡
      #（UiButton、RouterLink、DialogRoot）—— 元件對這 23 條規則是透明的。
      # 實測：同一批 .vue 用人眼讀出四個真缺陷，這 23 條一個都沒報。
      # 綠燈的意思是「靜態可查的那一半沒問題」，不是「頁面可用」。
      # 看不見的那一類具名列在 HANDOFF 第 22 項。
      #
      # 「掃到零個」與「什麼都沒掃到」在這裡長得一模一樣，所以有一條測試
      #（platform/eslint-config/tests/a11y.test.ts）在比對「repo 裡有幾個
      # .vue」與「閘門掃到幾個」。那條測試跑在上面的「測試」步驟裡。
      - name: 層 1 約束 · 無障礙靜態檢查
        run: ./node_modules/.bin/eslint --config platform/eslint-config/src/a11y.js . --max-warnings=0

      - name: Save Vite task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
