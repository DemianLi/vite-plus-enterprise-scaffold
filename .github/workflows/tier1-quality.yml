# Tier 1 — 品質（D10）
#
# 目標：快到開發者願意等。允許快取、允許 affected 過濾。
# 這一層**不放任何安全檢查** —— 安全走 tier2-security.yml，理由見該檔開頭。

name: Tier 1 — 品質

on:
  pull_request:
  push:
    branches: [main]

# 品質檢查可以被新的 push 取消：舊的結果已無意義。
# （Tier 2 刻意相反，見該檔。）
concurrency:
  group: tier1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # vite-plus 要求 ^20.19.0 || ^22.18.0 || >=24.11.0
          node-version: "24"

      # ── Bootstrap ────────────────────────────────────────────────────
      # 全新 checkout 沒有 node_modules，因此也沒有 vp。
      # 必須從**專案目錄之外**執行 npx，再用 -C 指回專案 ——
      # 在專案目錄內執行會被本專案的 devEngines.packageManager: pnpm
      # 以 EBADDEVENGINES 直接拒絕（此路徑已於本機實測，見 DECISIONS.md C8）。
      #
      # 內部 registry 環境下，這一步是第一個會斷的地方（R3／R5）：
      # 需設定 npm_config_registry 與 NODE_EXTRA_CA_CERTS。
      - name: Bootstrap Vite+
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes --package vite-plus@0.2.9 \
            vp -C "$GITHUB_WORKSPACE" install --frozen-lockfile

      # ── 任務快取 ─────────────────────────────────────────────────────
      # Tier 1 的主要提速手段。`vp run` 沒有 changed-since 過濾器，
      # 靠快取命中跳過未變動的任務（本機實測 4/5 命中）。
      - name: Restore Vite task cache
        id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      # ── 檢查 ─────────────────────────────────────────────────────────
      - name: 格式、lint、型別（oxfmt + oxlint + tsgolint）
        run: ./node_modules/.bin/vp check

      - name: 測試
        run: ./node_modules/.bin/vp run -r test

      - name: 建置
        run: ./node_modules/.bin/vp run -r build

      # ── 設計系統接縫（HANDOFF 第 24 項 / C62）─────────────────────────
      #
      # 為什麼在 Tier 1 而不是 Tier 2：與無障礙同一個理由（見下面那一段）。
      # Tier 2 的三條規則只為了一件事 —— 安全掃描的結果會隨時間失效。
      # **「各案換得掉配色」不會。** 沒有新公布的 CVE 會讓一個代幣變成換不掉。
      #
      # 這一步會真的跑兩次 Tailwind 建置（約 0.3 秒），因為它要驗的性質
      # 只有在產物裡看得到：Tailwind 掃不到來源時是**建置成功、CSS 還變大、
      # 但一個 utility 都沒有**。靜態讀 CSS 檔驗不到那件事。
      #
      # ⚠️ 綠燈的意思是「配色與形狀兩條軸實測可換」，**不是**「設計系統可換」。
      # 第三條軸（互動方式）被 api-surface 的 SFC_UNSUPPORTED 主動擋著，
      # 這道閘門完全看不到它。仍然開著的缺口寫在 HANDOFF 第 24 項。
      - name: 設計系統接縫
        run: node tools/theme-verify/src/cli.ts

      # ── 無障礙靜態檢查（HANDOFF 第 22 項）─────────────────────────────
      #
      # 為什麼在 Tier 1 而不是 Tier 2：Tier 2 的三條規則（不快取、不過濾、
      # 要有時間觸發）只有一個理由 —— 安全掃描的結果會隨時間失效。
      # **無障礙不會。** 沒有新公布的 CVE 會讓一個有 alt 的 img 變成沒有 alt，
      # 所以放進 Tier 2 只會讓那三條規則多一個不適用的例外。
      #
      # ⚠️ **這一步對本 repo 的正常結果是零個發現，而模板是有缺陷的。**
      # 它比對的是原生元素與屬性，而本 repo 的互動幾乎都包在元件裡
      #（UiButton、RouterLink、DialogRoot）—— 元件對這 23 條規則是透明的。
      # 實測：同一批 .vue 用人眼讀出四個真缺陷，這 23 條一個都沒報。
      # 綠燈的意思是「靜態可查的那一半沒問題」，不是「頁面可用」。
      # 看不見的那一類具名列在 HANDOFF 第 22 項。
      #
      # 「掃到零個」與「什麼都沒掃到」在這裡長得一模一樣，所以有一條測試
      #（platform/eslint-config/tests/a11y.test.ts）在比對「repo 裡有幾個
      # .vue」與「閘門掃到幾個」。那條測試跑在上面的「測試」步驟裡。
      - name: 無障礙靜態檢查
        run: ./node_modules/.bin/eslint --config platform/eslint-config/src/a11y.js . --max-warnings=0

      - name: Save Vite task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}
