# D2 退出演練（R1／R9）
#
# 每季實際把應用退回上游 Vite 建一次、跑一次測試，並更新帶日期的證據。
#
# ── 為什麼是獨立的 workflow ──────────────────────────────────────────
#
# 它連外網裝上游套件、耗時分鐘級，而且**會修改 repo 內容**（evidence.json）。
# 這三件事都不該混進 PR 閘門。Tier 2 只驗證那份證據還新鮮，不負責產生它。
#
# ── 為什麼是每季，不是每次 PR ────────────────────────────────────────
#
# 這場演練驗的是「工具鏈可以換掉」，那個性質不會因為某個 PR 改了一支元件而改變。
# 便宜的那一半（node tools/exit-drill/src/cli.ts）每次 PR 都跑，擋掉會腐化的部分。
#
# ⚠️ ── 這一段原本寫錯了，2026-08-16 修正（C64）──────────────────────
#
# 原文寫的是：「會改變它的是『有人開始在原始碼裡 import vite-plus』，
# 而那由 Tier 2 的靜態檢查每次 PR 都擋。」
#
# **那句話被 PR #15 證偽了。** 那個 PR 沒有人 import vite-plus —— 它只是加了
# 一個演練不會安裝的 devDependency（happy-dom），演練從此就是壞的，
# 而當時的靜態檢查看不見這一類。PR #32 又埋了第二個（eslint），
# 被第一個蓋住而沒有露出來。兩個都要等到下一次排程才會被發現。
#
# 現在靜態那一半涵蓋的是**三類**漂移，而且只有這三類：
#   1. 退出面擴大（原始碼 import vite-plus）
#   2. plugin 帳目（會改變產物的 plugin 沒登記）
#   3. 測試相依帳目（測試需要、演練卻不會裝的相依沒登記）← 新增
#
# **其餘的破壞方式仍然只有這場季演練看得到。** 這裡刻意不再寫「所以每季就夠」——
# 那正是原本那句話犯的錯：把「涵蓋了幾類」講成「涵蓋了全部」。

name: D2 退出演練（每季）

on:
  schedule:
    # 每季第一天 03:00 UTC。與 120 天的證據有效期對得上，留有餘裕。
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # 見 tier1-quality.yml 對這一步的說明（DECISIONS.md C8）。
      - name: Bootstrap Vite+
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes --package vite-plus@0.2.9 \
            vp -C "$GITHUB_WORKSPACE" install --frozen-lockfile

      # 演練本身在 os.tmpdir() 裡用 npm 裝上游 vite/vitest ——
      # 在專案目錄內跑 npm 會被 devEngines 以 EBADDEVENGINES 擋下（C8）。
      - name: 執行完整退出演練
        run: node tools/exit-drill/src/cli.ts --full

      # 證據要進版控才算控制措施。這裡上傳成 artifact，並在摘要裡貼出來，
      # 由 platform maintainer 開 PR 把 evidence.json 併回 main。
      #
      # ⚠️ 刻意**不讓 CI 直接 push**：一個能寫 main 的 workflow token，
      # 本身就是一條需要向資安解釋的攻擊路徑，而這裡省下的只是一次 PR。
      - name: 上傳演練證據
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exit-drill-evidence
          path: tools/exit-drill/evidence.json
          # GitHub 的保留上限依方案而定（公開 repo 為 90 天）。填超過會被靜默調降
          # 並留下一條 annotation —— 實測過。真正的長期證據是進版控的 evidence.json，
          # 這份 artifact 只是方便下載，所以直接對齊上限。
          retention-days: 90

      - name: 摘要
        if: always()
        run: |
          {
            echo '## D2 退出演練結果'
            echo '```json'
            cat tools/exit-drill/evidence.json
            echo '```'
            echo '請由 platform maintainer 開 PR 將 evidence.json 併回 main。'
          } >> "$GITHUB_STEP_SUMMARY"
