# 供應鏈 — 重新擷取來源證明（D16）
#
# ── 這個 workflow 解的是什麼 ────────────────────────────────────────────
#
# Renovate 的每一個 PR 都會改 pnpm-lock.yaml，於是供應鏈閘門必然紅：
# provenance.json 記的 digest 對不上新的 lockfile。這是設計的結果，不是缺陷。
#
# 沒有這支，只剩兩條路，兩條都不好：
#
#   手動重擷 —— 每個升級 PR 都卡在「有人要在本機跑兩行指令」上。
#               升級節奏就是這樣死的，而升級節奏正是這整件事的目的。
#   自動重擷 —— 讓 bot 自己改 tools/supply-chain/ 底下的檔案。
#               那是 @org/security 共管的路徑，而 bot commit 會被 rubber-stamp。
#
# ── 為什麼是 workflow_dispatch（人按一下）而不是自動觸發 ────────────────
#
# 因為「要不要讓 CI 自主改寫資安共管的產物」是一個**治理決定**，
# 不該由實作者單方面做 —— 與 HANDOFF #12 的自動核准標籤同一個理由。
#
# workflow_dispatch 拿到的是兩邊的好處：`contents: write` 只存在於這一支
# workflow（Tier 2 的權限完全沒有放寬），動作由具名的人發起而不是 bot，
# 而使用者只要按一下按鈕、不必在本機裝任何東西。
#
# 要改成自動觸發的話，那是一次要經資安核可的變更，不是一次調校。
#
# ── 安全邊界寫在程式碼裡，不是寫在這段註解裡 ────────────────────────────
#
# `--recapture-safe` 只在不同步**全部屬於「版本換了」**時才動手。
# 一旦出現 integrity-changed（同一個 name@version 內容物換了），它拒絕執行。
# 註解不會在半夜三點擋下任何東西，`isSafeToRecapture()` 會。

name: 供應鏈 — 重新擷取來源證明

on:
  workflow_dispatch:

# ⚠️ 這是本 repo 唯一一支有 contents: write 的 workflow。
# 它只做一件事：把重新擷取的 provenance.json 提交回**當前分支**。
permissions:
  contents: write

jobs:
  recapture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 直接推到預設分支等於繞過 CODEOWNERS —— 而 tools/supply-chain/
      # 正是 @org/security 共管的路徑之一。只准在 PR 分支上跑。
      - name: 拒絕在預設分支上執行
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::這支 workflow 會直接提交。請在 PR 分支上執行，不要在 ${{ github.ref_name }} 上。"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # 見 tier1-quality.yml 對這一步的說明（DECISIONS.md C8）。
      - name: Bootstrap Vite+
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes --package vite-plus@0.2.9 \
            vp -C "$GITHUB_WORKSPACE" install --frozen-lockfile

      # 144 個原生套件 × 2 次 registry 往返。幾分鐘。
      # 出現 integrity-changed 時這一步會紅，而且**應該**紅 —— 見 isSafeToRecapture。
      - name: 重新擷取（僅限升級造成的不同步）
        run: node tools/supply-chain/src/cli.ts --recapture-safe

      - name: 提交
        run: |
          if git diff --quiet -- tools/supply-chain/provenance.json; then
            echo "provenance.json 沒有變化 —— 不需要提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/supply-chain/provenance.json
          git commit -m "chore(supply-chain): 隨升級重新擷取來源證明

          由 ${{ github.actor }} 透過 supply-chain-recapture workflow 觸發。
          --recapture-safe 已確認所有不同步都只是版本變動，沒有內容物被換掉。"
          git push

          echo "::notice::provenance.json 已更新並提交。請在 PR 的 diff 裡確認新增／移除的套件符合預期。"
