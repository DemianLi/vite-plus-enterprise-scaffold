name: 一次性探測（用完即刪）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 假設：Trivy 只解 pnpm-lock.yaml 的第一份 YAML 文件。
      # 驗法：同一份 lockfile，一次原樣、一次只留第二份文件，比較 component 數。
      - name: 準備兩個變體
        run: |
          mkdir -p probe/asis probe/doc2
          cp package.json probe/asis/ && cp package.json probe/doc2/
          cp pnpm-lock.yaml probe/asis/
          node -e "
            const fs=require('fs');
            const t=fs.readFileSync('pnpm-lock.yaml','utf8');
            const parts=t.split('\n---\n');
            console.log('文件段數:', parts.length);
            fs.writeFileSync('probe/doc2/pnpm-lock.yaml', parts[parts.length-1]);
          "

      - name: 掃描 A —— 原樣（兩份文件）
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: probe/asis
          format: cyclonedx
          output: asis.json
          scanners: vuln

      - name: 掃描 B —— 只留第二份文件
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: probe/doc2
          format: cyclonedx
          output: doc2.json
          scanners: vuln

      - name: 比較
        run: |
          node -e "
            const n = f => (JSON.parse(require('fs').readFileSync(f,'utf8')).components||[]).length;
            const a = n('asis.json'), b = n('doc2.json');
            console.log('A 原樣（兩份文件）  :', a);
            console.log('B 只留第二份文件    :', b);
            console.log(a < b ? '→ 假設成立：多文件時 Trivy 只看到第一份' : '→ 假設不成立，另尋原因');
          "
