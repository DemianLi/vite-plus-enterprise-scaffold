packages:
  - apps/*
  - features/*
  - platform/*
  - tools/*

# D6 — catalog 是共用 lockfile 下唯一能讓 CVE 全 repo 同步升級的機制。
# 一律以 catalog: 引用；任何直接寫死版本的 package.json 會被一致性檢查擋下。
catalogMode: prefer

catalog:
  # --- 工具鏈（由 vite-plus 鎖定，勿手動改）---
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  # ⚠️ 必須與 vite-plus 內部鎖定的版本**完全一致**。vite-plus 把 vitest 釘死在
  # 精確版本（=4.1.10），此處若用 ^ 範圍或不同版本，node_modules 會出現兩份 vitest，
  # 測試會以難以診斷的方式失敗（型別對不上、mock 失效）。升 vite-plus 時要同步改這行。
  vitest: 4.1.10
  # 覆蓋率的 provider（C120）。⚠️ **同一句話**：它是 vitest 的內部套件，版本要
  # 與上面那行逐位相同。用 ^ 範圍的話，node_modules 會出現一份與 runner 版本
  # 不同的 provider，而症狀不是報錯，是覆蓋率數字看起來像那麼一回事。
  "@vitest/coverage-v8": 4.1.10

  # --- 應用層選型（D13）---
  vue: ^3.5.41
  vue-router: ^5.2.0
  pinia: ^4.0.3
  vue-i18n: ^11.4.8
  "@tanstack/vue-query": ^5.101.4
  "@vitejs/plugin-vue": ^6.0.8

  # --- 樣式與 UI（D15）---
  # reka-ui 是 headless 基元，Tailwind 負責樣式，元件原始碼在 platform/ui。
  # ⚠️ @tailwindcss/vite 會改變建置產物 —— 任何重新組出一份建置設定的流程
  # 若漏掉它，會建置成功卻交出一個完全沒有樣式的應用（C36）。
  reka-ui: ^2.10.3
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  # cn() 用。刻意不裝 class-variance-authority —— 變體用純物件查表就夠，
  # 少一個相依就是少一筆 SCA 範圍（與 D2 對 YAML parser 的同一條理由）。
  clsx: ^2.1.1
  tailwind-merge: ^3.4.1
  # UiDatePicker 用。⚠️ **這不是一筆新的供應鏈範圍**：它從第一天就在樹裡
  # （reka-ui 自己相依它），這裡做的只是把「本來就在用」寫成明的 ——
  # platform/ui 要直接 import CalendarDate 才建得出 DateValue。
  # ⚠️ 版本**逐字跟著 reka-ui 自己宣告的範圍**（^3.5.0），不是抄目前解到的
  # 3.12.3。寫得比它窄的話，reka-ui 哪天需要一個更舊的 3.x 就會產生第二份 ——
  # 那正是 D15 記過的 lightningcss 兩個版本、MPL-2.0 範圍翻倍的形狀。
  "@internationalized/date": ^3.5.0

  # --- 元件測試（§11 II ⑨ 的執行期那一層）---
  # ⚠️ C47 才剛以「會把瀏覽器二進位拉進供應鏈盤點範圍」為由拒絕 Playwright，
  # 這兩個看起來像同一件事，但成本完全不同：**純 JS，沒有平台二進位、
  # 沒有 postinstall 下載**。它們進 SBOM 與 dependency-health 的範圍，
  # 但它們沒有平台二進位要分類。理由見 C48。
  #
  # happy-dom 而不是 jsdom：兩者都**沒有實作 CSP**（所以瀏覽器實測那一層
  # 換不掉），但 happy-dom 快得多，而這裡要的只是一個能算 textContent 的 DOM。
  "@vue/test-utils": ^2.4.11
  happy-dom: ^20.11.2

  # --- 驗收規格（TESTING.md 的層 3，第二類的完成率設施）---
  # ⚠️ **不是第二套 runner** —— 它是 Vitest 上的一層 API，跑在既有的 Vitest 裡。
  # 養第二套 runner 會再撞一次 C87 的跨套件排程相依。
  #
  # ⚠️ peer 是 `vitest ^4.0.4`，與上面釘死的 4.1.10 相容（實測，C110）。
  # 升 vite-plus 而 vitest 跳出那個範圍時，這一行要一起看。
  "@amiceli/vitest-cucumber": ^7.0.0

  # --- 產生器（tools/slice-gen）---
  bingo: ^0.9.3
  zod: ^3.25.76

  # --- Tier 2 安全閘門（D5）。僅 CI 使用，不進 runtime bundle ---
  eslint: ^10.8.1
  eslint-plugin-security: ^4.0.1
  eslint-plugin-no-unsanitized: ^4.1.5
  eslint-plugin-vue: ^10.10.0
  typescript-eslint: ^8.67.0
  vue-eslint-parser: ^10.4.1

  # --- `.vue` 的型別檢查（HANDOFF #26／C68）。僅 CI 與本機使用 ---
  # ⚠️ 它的 typescript 在下面的具名 catalog，不在這裡 —— 那不是筆誤。
  vue-tsc: ^3.3.10

# ─────────────────────────────────────────────────────────────────────────────
# 具名 catalog：這個 repo 裡有**兩個 TypeScript**（C68）
# ─────────────────────────────────────────────────────────────────────────────
#
# 上面的 `typescript: ^7.0.2` 是**原生 Go 版**，`vp check` 的型別段（tsgolint）
# 用它。實測它不再提供 JS 版的 compiler API：
#
#     Object.keys(require("typescript")).length  → 2
#     typeof ts.createProgram                    → undefined
#
# 而 `vue-tsc` → `@volar/typescript` 需要那組 API。所以要檢查 `.vue`，
# 就必須讓 `tools/vue-typecheck` 這一個 package 解析到 JS 版的 TypeScript。
#
# ⚠️ **兩支編譯器對同一份 `.ts` 可能給出不一樣的診斷，而那種閘門會被關掉（C57）。**
# 這個風險是量過的，不是賭的：接上當天 vue-tsc 把四個程式裡的每一支 `.ts`
# 都檢查了，**產出 0 條 tsgolint 沒有的診斷**。範圍也刻意收窄 ——
# `tools/vue-typecheck` 只對含 `.vue` 的 package 跑，`.ts` 的判決仍然只有
# `vp check` 一個來源。
#
# ⚠️ 但**分歧不是要管理的風險，是那道閘門的能力**：`.ts` 檔消費 `.vue` 時
# tsgolint 看的是 `declare module "*.vue"` 的萬用宣告，vue-tsc 解析真的 SFC。
# 實測「vue-typecheck 紅、vp check 綠」多半是真陽性。見 C68 的〈九〉。
catalogs:
  vue-typecheck:
    typescript: ^5.9.3

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# ─────────────────────────────────────────────────────────────────────────────
# D6 — 供應鏈治理：build script 允許清單
# ─────────────────────────────────────────────────────────────────────────────
#
# postinstall 是 npm 生態第一大供應鏈攻擊面。pnpm >= 11 預設全部拒絕，
# 這份清單是唯一的開孔 —— 每一筆都是 PR 上看得見的一行 diff，必須寫明理由。
#
# 此處刻意「不」在 .npmrc 設 ignore-scripts=true：那會連本清單一併封鎖，
# 使允許機制失效（那才是真的沒有 build script，包括必要的那些）。
#
# 新增流程：先看該套件的 install script 實際做什麼，再決定。
#   pnpm why <pkg>              # 誰把它拉進來的
#   vp pm why <pkg>             # 同上，經 vp 抽象層
#
allowBuilds:
  # vue-demi：由 @tanstack/vue-query 間接引入。
  # 其 postinstall 僅在自身 package 目錄內切換 Vue 2 / Vue 3 的進入點檔案，
  # 不觸網、不寫 package 目錄外的檔案。不執行則 import 會解析失敗。
  # 審查人：@org/platform-maintainers｜審查日：2026-08-15
  vue-demi: true
