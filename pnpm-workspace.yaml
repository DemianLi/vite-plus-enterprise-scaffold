packages:
  - apps/*
  - features/*
  - platform/*
  - tools/*

# D6 — catalog 是共用 lockfile 下唯一能讓 CVE 全 repo 同步升級的機制。
# 一律以 catalog: 引用；任何直接寫死版本的 package.json 會被一致性檢查擋下。
catalogMode: prefer

catalog:
  # --- 工具鏈（由 vite-plus 鎖定，勿手動改）---
  "@types/node": ^24
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  # 交付匯出的建置引擎（C253）：匯出時 `vite` 改寫成這一版，vite-plus 與它帶的 vitest 不出門。
  # 放在這裡而不是寫在匯出工具裡：進了 lockfile，SCA 與 Renovate 才看得到它，CI 開機時它才在
  # store 裡 —— 匯出那棵樹的離線安裝靠的就是這一點。⚠️ 下面 `overrides` 的 `vite` 不會吃掉這個
  # alias（實測解析到的是上游 vite）。
  vite-upstream: npm:vite@8.2.2
  # ⚠️ 必須與 vite-plus 內部鎖定的版本**完全一致**。vite-plus 把 vitest 釘死在
  # 精確版本（=4.1.11），此處若用 ^ 範圍或不同版本，node_modules 會出現兩份 vitest，
  # 測試會以難以診斷的方式失敗（型別對不上、mock 失效）。升 vite-plus 時要同步改這行。
  # ⚠️⚠️ **vitest 的 CVE 只能靠升 vite-plus 修，不能用 `overrides`**（2026-09-10，
  # CVE-2026-84373 實測）：vite-plus 在執行期把 `@vitest/coverage-v8` 拿去比對它**打包時
  # 寫死的** `VITEST_VERSION` 常數，不看實際裝上去的 vitest —— override 蓋得掉安裝、
  # 蓋不掉那個常數，有開覆蓋率的 package 一律紅。把 coverage-v8 退回舊版能讓它綠，
  # 但那正是那道檢查要擋的混版：覆蓋率會安靜地變得不可靠。
  vitest: 4.1.11
  # 覆蓋率的 provider（C120）。⚠️ **同一句話**：它是 vitest 的內部套件，版本要
  # 與上面那行逐位相同。用 ^ 範圍的話，node_modules 會出現一份與 runner 版本
  # 不同的 provider，而症狀不是報錯，是覆蓋率數字看起來像那麼一回事。
  "@vitest/coverage-v8": 4.1.11

  # --- 樣式與 UI（D15）---
  # Base UI 是 headless 基元（下面 React 那一套），Tailwind 負責樣式，元件原始碼在 platform/ui。
  # ⚠️ @tailwindcss/vite 會改變建置產物 —— 它必須登記在 tools/exit-drill 的
  # DRILL_PLUGINS，否則退出演練會產出一個沒有樣式的應用然後回報 pass（C36）。
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  # cn() 用。刻意不裝 class-variance-authority —— 變體用純物件查表就夠，
  # 少一個相依就是少一筆 SCA 範圍（與 D2 對 YAML parser 的同一條理由）。
  clsx: ^2.1.1
  tailwind-merge: ^3.4.1
  # UiDatePicker 用：值型別是 `CalendarDate`（C237 Q68），執行期用 CalendarDate 與
  # getDayOfWeek。它原本是跟著 reka-ui 進來的傳遞相依；reka-ui 隨 Vue 退場（C244）之後，
  # 它是 platform/ui 自己的一筆直接相依、自己的一筆供應鏈範圍。
  # ⚠️ 範圍 ^3.5.0 是當年逐字抄 reka-ui 宣告的（為了不產生第二份），那個理由隨 reka-ui
  # 失去對象；範圍沒有跟著收窄 —— 收窄是一次沒有人要求的升級決定，不是清理。
  "@internationalized/date": ^3.5.0

  # --- React 那一套（C232 §五、C233 Q53、C235）---
  # 元件由 shadcn CLI 的
  # Base UI 那一套產出再改寫（Q58）；**不是 radix-ui** —— Radix 的捲動鎖定會注入
  # 不帶 nonce 的 `<style>`，被 `style-src 'self'` 安靜擋掉（C233 §三）。
  # ⚠️ 「Base UI 不注入 `<style>`」由 `platform/ui/tests/base-ui-no-style.test.ts`
  # 對裝上去的那一版逐檔掃，升級時自己會紅，不靠 C233 那一次的量測。
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@base-ui/react": ^1.8.0
  # React 版 UiDatePicker 的日曆（C236 Q62、C238）。Base UI 沒有日曆；帶進 date-fns 與
  # @date-fns/tz 兩支傳遞相依。三支的閉包也在 base-ui-no-style.test.ts 裡逐檔掃
  # `createElement('style')`，理由同上面 Base UI 那一句。
  # ⚠️ 只 import 它自己的 `react-day-picker/locale` 裡用得到的語系（C238 Q71）——
  # 全部照字串查的話約 95 個 date-fns 語系一起進 bundle（壓縮後約 1.6MB）。
  react-day-picker: ^10.0.1
  # 切片與應用殼那一套（C232 §五 的選型、C240）。批次 ③ 才有消費者 —— 沒有消費者的
  # catalog 列沒有東西在驗（C234 §二），所以不提早加。
  react-router: ^8.3.1
  react-i18next: ^17.0.13
  i18next: ^26.4.2
  zustand: ^5.0.15
  "@tanstack/react-query": ^5.102.8
  # ⚠️ 會改變建置產物 —— 同 @tailwindcss/vite，必須登記在 tools/exit-drill 的 DRILL_PLUGINS（C36）。
  "@vitejs/plugin-react": ^6.1.1

  # --- 元件測試（§11 II ⑨ 的執行期那一層）---
  # ⚠️ C47 才剛以「會把瀏覽器二進位拉進供應鏈盤點範圍」為由拒絕 Playwright，
  # 這兩個看起來像同一件事，但成本完全不同：**純 JS，沒有平台二進位、
  # 沒有 postinstall 下載**。它們進 SBOM 與 dependency-health 的範圍，
  # 但永遠不會進 tools/supply-chain 的原生家族分類。理由見 C48。
  #
  # happy-dom 而不是 jsdom：兩者都**沒有實作 CSP**（所以 csp-verify 那一層
  # 換不掉），但 happy-dom 快得多，而這裡要的只是一個能算 textContent 的 DOM。
  happy-dom: ^20.11.2
  # React 那一半的對應（C232 §五）。同樣是純 JS。
  "@testing-library/react": ^16.3.3

  # --- 驗收規格（TESTING.md 的層 3，第二類的完成率設施）---
  # ⚠️ **不是第二套 runner** —— 它是 Vitest 上的一層 API，跑在既有的 Vitest 裡。
  # 養第二套 runner 會再撞一次 C87 的跨套件排程相依。
  #
  # ⚠️ peer 是 `vitest ^4.0.4`，與上面釘死的 4.1.11 相容（實測，C110）。
  # 升 vite-plus 而 vitest 跳出那個範圍時，這一行要一起看。
  "@amiceli/vitest-cucumber": ^7.0.0

  # --- 產生器（tools/slice-gen）---
  bingo: ^0.9.3
  zod: ^3.25.76

  # --- Tier 2 安全閘門（D5）。僅 CI 使用，不進 runtime bundle ---
  eslint: ^10.8.1
  eslint-plugin-security: ^4.0.1
  eslint-plugin-no-unsanitized: ^4.1.5
  typescript-eslint: ^8.67.0

  # --- Tier 1 無障礙閘門（HANDOFF 第 22 項／C60）。同樣僅 CI 與本機使用 ---
  # ⚠️ 它跑在 Tier 1 而不是 Tier 2：無障礙的檢查結果不會隨時間失效，
  # 而那正是 Tier 2「不快取、不過濾、每日排程」三條規則的**唯一**理由。
  # `.tsx` 那一軌（C234，Q56）。**是分支不是上游，而那是量過之後人裁的**：上游
  # eslint-plugin-jsx-a11y 6.10.2 的 peer 只宣告到 ESLint 9、最後一版 2024-10（相依健康度
  # 會紅），而且多拉 112 支套件；這個分支開的是同一份 36 條規則（上游標淘汰的 3 條
  # 這裡本來就不開）、明文支援 ESLint 10、只多 8 支。
  # ⚠️ 代價：0.x、單一維護者。它停了就換回上游 —— `a11y.js` 的命名空間仍叫
  # `jsx-a11y`，規則 ID、fixture 與交付文件都不必跟著改。
  eslint-plugin-jsx-a11y-x: ^0.2.0

  # --- 突變測試（TESTING.md 的元層）。僅本機與手動使用，不擋任何東西 ---
  # ⚠️ **兩支釘死在精確版本，不用 `^`。** 它的產出是一份「哪些程式碼被改壞了而
  # 測試沒說話」的清單，而**變異運算子的集合是隨版本改的** —— minor 升上去，
  # 清單會多出或少掉一批，而那與程式碼品質無關。#150 的基準是 10.0.0 量的。
  # ⚠️ runner 的 peer 是 `vitest >=2.0.0`，涵蓋上面釘死的 4.1.11。
  "@stryker-mutator/core": 10.0.0
  "@stryker-mutator/vitest-runner": 10.0.0

overrides:
  vite: "catalog:"

  # ⚠️ **CVE-2026-8723**（qs 的 DoS，Trivy 判 HIGH，`exit-code: 1` 因此開火）。
  # 傳遞路徑：`@stryker-mutator/core@10.0.0` → `typed-rest-client` → `qs@6.15.1`。
  # 修法版本 6.15.2，這裡直接釘上去。
  #
  # ⚠️ **為什麼不是升 stryker**：C121 把那兩支**釘死在精確版本**，理由是
  # 變異運算子的集合隨版本改 —— 升上去，#150 的基準清單就不再可比，
  # 而那與這個 CVE 無關。override 只換掉那一個傳遞相依，基準不動。
  #
  # ⚠️ **這一筆是併線那天第一次量到的**（C133）：SCA 掃描是 `main` 的閘門，
  # 而 stryker 是 `release/v1` 帶進來的 —— 兩邊從來沒有見過面。
  # 拿掉 stryker 的那天，這一行也要一起拿掉（`pnpm why qs` 會告訴你還有沒有人用）。
  #
  # ⚠️⚠️ **`>=6.15.2` → `>=6.16.0`（2026-09-03）：上面那個下限過期了。**
  # 它當時是對的，而 `>=` 讓 qs 一路往上解到 6.15.3 —— 然後 6.15.3 自己中了
  # 兩條：CVE-2026-82417（`qs.stringify` 的 TypeError）與 CVE-2026-82562
  # （陣列上限繞過的 DoS）。兩條的修法版本都恰好是 **6.16.0**，而 npm 上
  # **沒有 6.15.4**，所以 6.16.0 是唯一同時滿足兩條的下限。
  #
  # ⚠️ **這與 #226 是同一種病**：一個當時正確的數字被時間推到不再正確，而沒有
  # 任何東西會說話 —— 差別只在那邊是 lint 門檻、這邊是 override 下限。
  # 「訂下來的數字會過期」這件事，這棵樹現在有兩個實例、零個守衛。
  #
  # ⚠️ **`typed-rest-client@2.3.1` 宣告的是 `qs: "6.15.1"`（精確版本，不是範圍）。**
  # 也就是說今天解到 6.15.3 完全是這一行 override 造成的 —— 它上游從來沒有
  # 預期過 6.16.0。這是 override 的代價，寫在這裡是為了讓下一個人知道它存在。
  qs: ">=6.16.0"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# ─────────────────────────────────────────────────────────────────────────────
# D6 — 供應鏈治理：build script 允許清單
# ─────────────────────────────────────────────────────────────────────────────
#
# postinstall 是 npm 生態第一大供應鏈攻擊面。pnpm >= 11 預設全部拒絕，
# 這份清單是唯一的開孔 —— 每一筆都是 PR 上看得見的一行 diff，必須寫明理由。
#
# 此處刻意「不」在 .npmrc 設 ignore-scripts=true：那會連本清單一併封鎖，
# 使允許機制失效（那才是真的沒有 build script，包括必要的那些）。
#
# 新增流程：先看該套件的 install script 實際做什麼，再決定。
#   pnpm why <pkg>              # 誰把它拉進來的
#   vp pm why <pkg>             # 同上，經 vp 抽象層
#
# C244 起零筆：最後一筆 vue-demi 原本記成 @tanstack/vue-query 帶進來的，C240 拿掉 vue-query
# 之後它還在 —— 真正的來源是 reka-ui → @floating-ui/vue，隨 reka-ui 一起退場。
allowBuilds: { vue-demi: set this to true or false }
