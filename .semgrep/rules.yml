# 手寫的 SAST 規則。
#
# ⚠️ **這一段原本寫著「與 Tier 1／Tier 2 零重疊是刻意的」，實測推翻**
# （C210／#241，2026-09-09）。真相是：兩條規則都與既有檢查重疊，而**兩條都不是
# 多餘的** —— 各自買到的那一小塊寫在它自己那一條上面。⚠️ 不要把這一段讀成
# 「所以可以刪」：實測是「說明書寫錯了」，不是「規則沒有用」。
#
# ── 為什麼還需要 SAST，明明已經有 oxlint 與 ESLint ──────────────────
#
# lint 看的是**單一節點**：這一行有沒有用 eval、這個屬性是不是 v-html。
# SAST 看得到的是**資料怎麼流**：使用者輸入從路由參數進來，經過兩個函式，
# 最後流進 innerHTML —— 每一行單獨看都沒問題。
#
# ⚠️ **那是下面第一條規則的理由**（它有 `mode: taint`）。**第二條沒有** ——
# 它是單節點的 `pattern-either`，正好是這一段說「不放」的那一類。
# 它留下來的理由不是資料流，見它自己那一條。
#
# ── ⚠️ 這不是那份要交給稽核的 SAST 報告 ────────────────────────────
#
# 源碼檢測與弱點掃描由專業廠商執行，那份報告才是稽核要的東西。
# 這裡的規則是**開發當下**的守衛：讓廠商報告上少幾條，而不是取代它。
#
# 判準因此偏向**高精準、低噪音** —— 一道在開發流程裡亂叫的閘門會被關掉，
# 而被關掉的閘門連「少幾條」都做不到。
rules:
  - id: tainted-route-input-to-dom-sink
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      路由參數（使用者可控）流進了 DOM sink。這是 lint 看不到的一類：
      每一行單獨看都沒問題，問題在資料的流向。
      改法：輸出走文字插值；真的要導頁的話，先用允許清單驗證。
    pattern-sources:
      - pattern: $ROUTE.query
      - pattern: $ROUTE.params
      - pattern: useRoute().query
      - pattern: useRoute().params
    # ⚠️ 六個 sink 裡**只有中間三個是這條規則獨有的**（C210／#241 實測，
    # 2026-09-09 重驗）：`innerHTML`／`outerHTML`／`document.write` 被 Tier 2 的
    # ESLint `no-unsanitized` 蓋掉，而且**更寬** —— 它不需要 taint，任何非字面值的
    # 指派都紅。所以在那三格上這條規則不只是重疊，是**嚴格較弱**。
    #
    # 真正買到的是**開放重導向**那三格（`location.href`／`window.location.href`／
    # `window.open`），ESLint 對它們零命中（兩向探針實測）。
    # ⚠️ 而 `message` 與檔頭講的都是 DOM sink —— **買到的東西與說明書寫的不是
    # 同一件**。留著前三格是為了讓 taint 的示範完整（`rules.ts` 的反向測試就用
    # `innerHTML` 那一格），不是因為它們有獨有價值。
    pattern-sinks:
      - pattern: $EL.innerHTML = $X
      - pattern: $EL.outerHTML = $X
      - pattern: location.href = $X
      - pattern: window.location.href = $X
      - pattern: window.open($X, ...)
      - pattern: document.write($X)

  # ⚠️⚠️ **這一條的三個 pattern 全部被 oxlint `no-implied-eval` 蓋掉**，而且 oxlint
  # 那一側是**嚴格超集**：路徑更寬（全樹，只關掉 `.semgrep/**`）、語言更多
  # （`.vue` 的 `<script setup>` 也掃）、一樣擋 PR（Tier 1，`vp check`）。
  # C210／#241 三個 pattern 逐條實測，三條全中。
  #
  # **那它為什麼留著？抑制註解。** 兩向探針（2026-09-09 重驗）：
  #
  #     new Function("return 1")                                → oxlint RC=1，點名 no-implied-eval
  #     ＋ // oxlint-disable-next-line typescript/no-implied-eval → oxlint RC=0，完全安靜
  #
  # semgrep 不認得 oxlint 的抑制註解，所以那一行寫下去的那天，只剩這一條在看。
  # ⚠️ 而**全樹沒有任何閘門在管抑制註解**（`reportUnusedDisableDirectives`／
  # `no-inline-config` 皆無）。今天的普查：`oxlint-disable` **0** 處、
  # `nosemgrep` **0** 處、`eslint-disable-next-line` **3** 處。
  # **今天不痛是巧合，不是設計** —— 同 `gates.ts` 對 plugin 那條規則寫過的話。
  - id: runtime-code-construction
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      執行期組出程式碼會逼 CSP 放寬 script-src 到 'unsafe-eval'（D11／R6）。
      整份 CSP 的價值建立在沒有這一條上 —— 而放寬是靜默的，
      症狀只有「某天被滲透測試開單」。
    pattern-either:
      - pattern: new Function(...)
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)
    paths:
      # 只看會進 runtime bundle 的東西。tools/ 是建置期腳本，
      # 它們的程式碼不會被瀏覽器載入，CSP 管不到也不需要管。
      #
      # ⚠️ 前導斜線是必要的，不是風格（#149）。無前導斜線的 `apps/**` 在
      # semgrep 現行版本裡是**不錨定**的 —— 它匹配「路徑裡任何一層叫 apps 的」，
      # 而 semgrep 已經在警告它「即將」改成錨定的 `/apps/**`。
      # 兩種語意**不等價**，實測：`tools/d/apps/src/nested.ts` 在 `apps/**` 下
      # 被掃到，在 `/apps/**` 下不會 —— 也就是**升版會讓射程安靜地縮小**，
      # 而規則檔一個字都不用動。
      #
      # 錨定是這裡要的那一個：上面那句「tools/ 不看」在不錨定的寫法下本來就
      # 是漏的（`tools/*/apps/` 會被掃到）。⚠️ 這棵樹現在沒有那種目錄，
      # 所以兩種寫法今天的射程相同 —— **這是巧合，不是保證**。
      include:
        - "/apps/**"
        - "/features/**"
        - "/platform/**"
      # ⚠️ 這一條**刻意不加前導斜線**：任何深度的 tests/ 都要排掉。
      # `**/` 開頭的樣式不受上面那個改版影響（semgrep 只對無前導斜線、
      # 也無 `**/` 前綴的樣式發警告），實測 `apps/tests/` 與
      # `platform/c/tests/` 兩種深度都排得掉。
      exclude:
        - "**/tests/**"
